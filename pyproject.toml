[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phone-agent-cli"
version = "0.1.0"
description = "A Termux-first, provider-agnostic phone tool bridge for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "Paradox-ultra"}]
dependencies = []

[project.scripts]
phone-agent = "phone_agent.cli:main"

[tool.setuptools.packages.find]
include = ["phone_agent*"]
